services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-admin
      POSTGRES_DB: postgres
      AINC_DB_SUFFIX: ${AINC_DB_SUFFIX}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentinc -d agentinc_${AINC_DB_SUFFIX}"]
      interval: 2s
      timeout: 2s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DBNAME: temporal_${AINC_DB_SUFFIX}
      VISIBILITY_DBNAME: visibility_${AINC_DB_SUFFIX}
      SKIP_DB_CREATE: "true"
    ports:
      - "127.0.0.1::7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 3s
      timeout: 3s
      retries: 40

  temporal-ui:
    image: temporalio/ui:2.52.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1::8080"
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres:
