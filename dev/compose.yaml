services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-admin
      POSTGRES_DB: postgres
      AINC_DB_SUFFIX: ${AINC_DB_SUFFIX}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentinc -d agentinc_${AINC_DB_SUFFIX}"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres:
