# cargo-deny policy. `cargo xtask check` runs `cargo deny check` when cargo-deny is installed.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates pinned by GPUI; nothing to do here until Zed moves off them.
ignore = [
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
    "RUSTSEC-2026-0206", # rustybuzz
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "bzip2-1.0.6",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Many of our dependencies are pinned by GPUI; duplicate versions are the norm, not a bug.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI and the forks it pins.
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/proptest-rs/proptest",
]

# The Temporal SDK crates publish without a license field; the repository is MIT.
[[licenses.clarify]]
crate = "temporalio-client"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-common"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-common-wasm"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-macros"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-protos"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-sdk"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-sdk-core"
expression = "MIT"
license-files = []
[[licenses.clarify]]
crate = "temporalio-workflow"
expression = "MIT"
license-files = []
