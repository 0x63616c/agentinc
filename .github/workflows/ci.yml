name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same two commands `just check` and `just test` run locally; nothing is re-listed here.
  workspace:
    name: workspace (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [check, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per lane; only main writes it so pull requests cannot poison it.
          key: ${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          # Pinned so `cargo xtask check` runs taplo here instead of skipping it.
          tool: cargo-nextest,taplo@0.10.0
      # `cargo xtask check` and `test` prove .sqlx/ current with `cargo sqlx prepare --check`.
      - name: Cache sqlx-cli
        id: sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.8.6-${{ runner.os }}
      - if: steps.sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - if: matrix.check == 'check'
        run: cargo xtask check --profile ci
      - if: matrix.check == 'test'
        # Includes generated_api_and_clients_are_current from ainc-generate: no second build.
        run: cargo xtask test --profile ci
  # Preserve the required check/release gate name, and fail closed on skipped or
  # cancelled lanes as well as failures. Never let one green matrix lane suffice.
  rust:
    needs: [workspace]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane
        env:
          WORKSPACE: ${{ needs.workspace.result }}
        run: test "$WORKSPACE" = success
