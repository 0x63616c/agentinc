name: Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to distribute
        required: true
      test:
        type: boolean
        default: true
        description: Sign and notarize into a draft only
      build:
        type: boolean
        default: true
        description: Build on homelab-mini (disable to use an existing build-COMMIT draft)
concurrency:
  group: distribution-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.actor == '0x63616c')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release trigger
        id: version
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            changed=$(python3 scripts/release/version-changed.py "$BEFORE")
            echo "ready=$changed" >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
  native:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && (github.event_name == 'push' || inputs.build != false)
    runs-on: [self-hosted, macOS, ARM64, agentinc-release]
    concurrency:
      group: agentinc-native-e2e
      cancel-in-progress: false
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: "0"
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Show release Xcode version
        run: xcodebuild -version
      - name: Prepare pinned build tools inside runner work directory
        run: |
          export CARGO_HOME="$RUNNER_WORKSPACE/.cargo"
          export RUSTUP_HOME="$RUNNER_WORKSPACE/.rustup"
          export CARGO_TARGET_DIR="$RUNNER_WORKSPACE/.cargo-target"
          {
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          } >> "$GITHUB_ENV"
          {
            echo "$HOME/.cargo/bin"
            echo "$RUNNER_WORKSPACE/release-tools"
          } >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.98.1 --profile minimal
          tools="$RUNNER_WORKSPACE/release-tools"
          mkdir -p "$tools"
          if [ ! -x "$tools/temporal" ]; then
            curl --fail --location --output "$tools/temporal.tar.gz" https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_darwin_arm64.tar.gz
            test "$(shasum -a 256 "$tools/temporal.tar.gz" | cut -d ' ' -f 1)" = 41e0425378fcb4fb5766340b97435e20fe47bbff2d7bf644ec2d51f7662b7c56
            tar -xzf "$tools/temporal.tar.gz" -C "$tools" temporal
            rm "$tools/temporal.tar.gz"
          fi
          if [ ! -x "$tools/codex" ]; then
            curl --fail --location --output "$tools/codex.tar.gz" https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-aarch64-apple-darwin.tar.gz
            test "$(shasum -a 256 "$tools/codex.tar.gz" | cut -d ' ' -f 1)" = 5e5a51470dce2423f9d96bd191d0bbc4cc0e2848a6833df5178eaf47a07a3768
            tar -xzf "$tools/codex.tar.gz" -C "$tools"
            mv "$tools/codex-aarch64-apple-darwin" "$tools/codex"
            rm "$tools/codex.tar.gz"
          fi
          if [ ! -x "$tools/protoc/bin/protoc" ]; then
            curl --fail --location --output "$tools/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-osx-aarch_64.zip
            test "$(shasum -a 256 "$tools/protoc.zip" | cut -d ' ' -f 1)" = 9cd98a532c5c5e0c4161314de0225de27e4c8a323917b6ea7b1b714d3ae23466
            mkdir -p "$tools/protoc"
            unzip -q "$tools/protoc.zip" -d "$tools/protoc"
            rm "$tools/protoc.zip"
          fi
          echo "PROTOC=$tools/protoc/bin/protoc" >> "$GITHUB_ENV"
      - name: Build unsigned native handoff
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.commit || github.sha }}'
          python3 scripts/release/measure-build.py cargo xtask release
      - name: Build isolated upgrade fixtures
        run: |
          set -euo pipefail
          commit='${{ inputs.commit || github.sha }}'
          mkdir -p .local/upgrade-input
          mv ".local/release/$commit/unsigned.tar.gz" .local/upgrade-input/unsigned.tar.gz
          openssl genpkey -algorithm ED25519 -out .local/upgrade-input/test-key.pem
          public=$(openssl pkey -in .local/upgrade-input/test-key.pem -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
          export AINC_UPGRADE_TEST_PUBLIC_KEY="$public"
          python3 scripts/release/prepare.py
          mv ".local/release/$commit/unsigned.tar.gz" .local/upgrade-input/upgrade-candidate-unsigned.tar.gz
          candidate_version=$(python3 -c 'import json,subprocess; print(next(p["version"] for p in json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version=1"]))["packages"] if p["name"]=="ainc-release"))')
          next_version=$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); print(f"{a}.{b}.{c+1}")' "$candidate_version")
          export AINC_UPGRADE_TEST_VERSION="$next_version"
          python3 scripts/release/prepare.py
          mv ".local/release/$commit/unsigned.tar.gz" .local/upgrade-input/upgrade-newer-unsigned.tar.gz
          cp "$CARGO_TARGET_DIR/release/ainc-release-manifest" .local/upgrade-input/ainc-release-manifest
          unset AINC_UPGRADE_TEST_VERSION
          for tag in $(git tag --list 'v*' --sort=version:refname); do
            prior_version="${tag#v}"
            if ! python3 -c 'import sys; a,b=(tuple(map(int,v.split("."))) for v in sys.argv[1:]); sys.exit(0 if a < b else 1)' "$prior_version" "$candidate_version"; then
              continue
            fi
            if ! git grep -q AINC_UPGRADE_TEST_PUBLIC_KEY "$tag" -- crates/ainc-release/build.rs; then
              echo "Legacy feed locked: $tag has no test-only feed build"
              continue
            fi
            prior_dir=".local/upgrade-prior/$tag"
            git clone --shared --quiet --no-checkout . "$prior_dir"
            git -C "$prior_dir" checkout --quiet "$tag"
            (cd "$prior_dir" && python3 scripts/release/prepare.py)
            mv "$prior_dir/.local/release/$(git -C "$prior_dir" rev-parse HEAD)/unsigned.tar.gz" ".local/upgrade-input/upgrade-prior-$prior_version-unsigned.tar.gz"
            rm -rf "$prior_dir"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ inputs.commit || github.sha }}
          path: .local/upgrade-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove per-release files
        if: always()
        run: rm -rf .local/release .local/release-inputs .local/upgrade-input .local/upgrade-prior
  distribute:
    needs: [prepare, native]
    if: always() && needs.prepare.outputs.ready == 'true' && (needs.native.result == 'success' || (needs.native.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.build == false))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.native.result == 'success'
        with:
          name: unsigned-${{ inputs.commit || github.sha }}
          path: .local/distribution
      - name: Require native handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.sha }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [ "$NATIVE_RESULT" = success ]; then
            test -s .local/distribution/unsigned.tar.gz
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif gh release view "build-$COMMIT" >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Upload unsigned.tar.gz to a build-COMMIT draft, then rerun Distribution with build=false.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install rcodesign
        if: steps.handoff.outputs.ready == 'true'
        run: |
          curl --fail --location --output rcodesign.tar.gz https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --output rcodesign.tar.gz.sha256 https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz.sha256
          test "$(sha256sum rcodesign.tar.gz | cut -d ' ' -f 1)" = "$(cut -d ' ' -f 1 rcodesign.tar.gz.sha256)"
          tar xf rcodesign.tar.gz
          find "$PWD" -name rcodesign -type f -exec dirname {} \; >> "$GITHUB_PATH"
      - name: Sign, notarize, staple and distribute
        if: steps.handoff.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.sha }}
          NATIVE_RESULT: ${{ needs.native.result }}
          TEST_RELEASE: ${{ github.ref != 'refs/heads/main' || inputs.test == true }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          UPDATE_SIGNING_KEY_ED25519_PEM: ${{ secrets.UPDATE_SIGNING_KEY_ED25519_PEM }}
        run: |
          if [ "$NATIVE_RESULT" = success ]; then
            archive=(--archive .local/distribution/unsigned.tar.gz --upgrade-candidate .local/distribution/upgrade-candidate-unsigned.tar.gz --upgrade-newer .local/distribution/upgrade-newer-unsigned.tar.gz)
            for prior in .local/distribution/upgrade-prior-*-unsigned.tar.gz; do
              [ ! -f "$prior" ] || archive+=(--upgrade-prior "$prior")
            done
          else
            archive=()
          fi
          if [ "$TEST_RELEASE" = true ]; then
            python3 scripts/release/distribute.py --commit "$COMMIT" "${archive[@]}" --test --stage
          else
            python3 scripts/release/distribute.py --commit "$COMMIT" "${archive[@]}" --stage
          fi
      - uses: actions/upload-artifact@v4
        if: steps.handoff.outputs.ready == 'true'
        with:
          name: upgrade-signed-${{ inputs.commit || github.sha }}
          path: |
            .local/distribution/upgrade-candidate.tar.gz
            .local/distribution/upgrade-newer.tar.gz
            .local/distribution/upgrade-prior-*.tar.gz
            !.local/distribution/upgrade-prior-*-unsigned.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: steps.handoff.outputs.ready == 'true'
        with:
          name: app-signed-${{ inputs.commit || github.sha }}
          path: .local/distribution/AgentInc.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  upgrade:
    needs: [prepare, native, distribute]
    if: needs.distribute.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, agentinc-release]
    concurrency:
      group: agentinc-native-e2e
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - name: Show release Xcode version
        run: xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ inputs.commit || github.sha }}
          path: .local/upgrade-input
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-signed-${{ inputs.commit || github.sha }}
          path: .local/upgrade-signed
      - uses: actions/download-artifact@v4
        with:
          name: app-signed-${{ inputs.commit || github.sha }}
          path: .local/signed-input
      - name: Gate signed app, daemon and terminal
        run: |
          mkdir -p .local/signed-install
          tar -xzf .local/signed-input/AgentInc.tar.gz -C .local/signed-install
          python3 scripts/e2e/run.py --app .local/signed-install/AgentInc.app --output .local/signed-e2e-evidence
      - name: Gate native upgrade paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .local/upgrade-input/ainc-release-manifest
          prior=()
          for archive in .local/upgrade-signed/upgrade-prior-*.tar.gz; do
            case "$archive" in *-unsigned.tar.gz) continue;; esac
            [ ! -f "$archive" ] || prior+=(--prior "$archive")
          done
          python3 scripts/release/upgrade-gate.py \
            --candidate .local/upgrade-signed/upgrade-candidate.tar.gz \
            --newer .local/upgrade-signed/upgrade-newer.tar.gz \
            --key .local/upgrade-input/test-key.pem \
            --manifest-tool .local/upgrade-input/ainc-release-manifest \
            "${prior[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-e2e-${{ inputs.commit || github.sha }}
          path: .local/signed-e2e-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove upgrade fixtures
        if: always()
        run: rm -rf .local/upgrade-input .local/upgrade-signed .local/signed-input .local/signed-install
  publish:
    needs: [prepare, distribute, upgrade]
    if: needs.upgrade.result == 'success' && ((github.ref == 'refs/heads/main' && inputs.test != true) || (github.event_name == 'workflow_dispatch' && inputs.test == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check draft lookup without a checkout
        if: inputs.test == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit='${{ inputs.commit || github.sha }}'
          test "$(gh release view "phase5-test-${commit:0:12}" --json isDraft --jq .isDraft)" = true
      - name: Publish only after native upgrade gate
        if: inputs.test != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.prepare.outputs.version }}'
          test -n "$version"
          gh release edit "v$version" --draft=false --latest
