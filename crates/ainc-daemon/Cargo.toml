[package]
name = "ainc-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "aincd"
path = "src/main.rs"

# Test fixture only: a fake Codex app-server for AGENTINC_CODEX_PATH.
[[bin]]
name = "codex-fixture"
path = "src/bin/codex_fixture.rs"

[dependencies]
# The daemon needs only the product identity. Kept under the old crate name until the
# sources switch to `ainc_identity::` (a mechanical rename deferred to avoid merge churn).
ainc-release = { package = "ainc-identity", path = "../ainc-identity" }
libc = "0.2"
sha2 = "0.10"
turnkeel.workspace = true
futures.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
tokio = { workspace = true, features = ["net", "process", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.29"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
utoipa = { version = "5.5", features = ["axum_extras"] }

[dev-dependencies]
turnkeel = { workspace = true, features = ["testing"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
