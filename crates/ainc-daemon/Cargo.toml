[package]
name = "ainc-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "aincd"
path = "src/main.rs"

[dependencies]
ainc-release = { path = "../ainc-release" }
libc = "0.2"
sha2 = "0.10"
turnkeel.workspace = true
futures.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "json"] }
tokio = { workspace = true, features = ["net", "process", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.29"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
utoipa = { version = "5.5", features = ["axum_extras"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
