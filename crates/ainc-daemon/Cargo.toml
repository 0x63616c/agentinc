[package]
name = "ainc-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "aincd"
path = "src/main.rs"

[dependencies]
# The daemon needs only the product identity. Kept under the old crate name until the
# sources switch to `ainc_identity::` (a mechanical rename deferred to avoid merge churn).
ainc-release = { package = "ainc-identity", path = "../ainc-identity" }
libc = "0.2"
futures.workspace = true
anyhow.workspace = true
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "migrate",
  "json",
  "macros",
] }
tokio = { workspace = true, features = [
  "net",
  "process",
  "io-util",
  "io-std",
  "signal",
  "time",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid.workspace = true
utoipa = { version = "5.5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tower-http = { version = "0.6", features = ["set-header", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
