[package]
name = "ainc-xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ainc-release = { path = "../ainc-release" }
anyhow.workspace = true
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = { version = "0.8", features = ["preserve_order"] }
uuid.workspace = true

[dev-dependencies]
roxmltree = "0.21"
