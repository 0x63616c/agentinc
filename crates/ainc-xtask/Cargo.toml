[package]
name = "ainc-xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
ainc-release = { path = "../ainc-release" }
ainc-daemon = { path = "../ainc-daemon" }
anyhow.workspace = true
openapiv3 = "2"
prettyplease = "0.2"
progenitor = "0.14"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
tempfile = "3"
