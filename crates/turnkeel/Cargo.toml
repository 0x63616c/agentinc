[package]
name = "turnkeel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Durable AI agents in Rust"

[lints]
workspace = true

[package.metadata.cargo-machete]
# sdk-core only turns on TLS for the dev-server download; the workflow crate is named by the
# temporalio macros' expansion.
ignored = ["temporalio-sdk-core", "temporalio-workflow"]

[dependencies]
turnkeel-macros.workspace = true

anyhow.workspace = true
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

temporalio-sdk.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-macros.workspace = true
temporalio-workflow.workspace = true
temporalio-sdk-core.workspace = true

[features]
# The `testing` module and the local Temporal dev server (downloads a pinned Temporal CLI).
# Tests and the daemon's dev-dependencies enable it; shipped binaries do not.
testing = ["temporalio-sdk/testing"]

[dev-dependencies]
turnkeel = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
