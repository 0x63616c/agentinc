["dependencies"."sum_tree"]
"git" = "https://github.com/zed-industries/zed"
"rev" = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8"

["dependencies"."thiserror"]
"version" = "2.0.12"

["dependencies"."gpui_util"]
"git" = "https://github.com/zed-industries/zed"
"rev" = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8"

["dependencies"."hdrhistogram"]
"version" = "7"
"default-features" = false
