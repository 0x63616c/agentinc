["package"]
"name" = "gpui"
"version" = "0.2.2"
"edition" = "2024"
"authors" = ["Nathan Sobo <nathan@zed.dev>"]
"description" = "Zed's GPU-accelerated UI framework"
"repository" = "https://github.com/zed-industries/zed"
"publish" = false
"license" = "Apache-2.0"
"homepage" = "https://gpui.rs"
"readme" = "README.md"
"keywords" = ["desktop", "gui", "immediate"]
"categories" = ["gui"]
"autoexamples" = false
"autotests" = false
"autobenches" = false
["package"."metadata"]
["package"."metadata"."cargo-shear"]
"ignored" = ["bindgen", "font-kit", "getrandom", "objc2", "objc2-metal"]
"ignored-paths" = ["src/_ownership_and_data_flow.rs"]



["lints"]
["lints"."rust"]
["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(rust_analyzer)"]



["features"]
"default" = ["font-kit", "wayland", "x11", "windows-manifest"]
"test-support" = ["leak-detection", "collections/test-support", "http_client/test-support", "wayland", "x11", "proptest"]
"bench-support" = ["profiler", "dep:criterion"]
"bench" = ["bench-support"]
"inspector" = ["gpui_macros/inspector"]
"leak-detection" = ["backtrace"]
"wayland" = []
"x11" = ["scap?/x11"]
"screen-capture" = ["scap"]
"windows-manifest" = ["dep:embed-resource"]
"profiler" = ["dep:hdrhistogram"]
"stacker" = ["dep:stacksafe"]
"pilot" = []

["lib"]
"path" = "src/gpui.rs"

["dependencies"]
"num_cpus" = "1.13"
"parking" = "2.0.0"
"ttf-parser" = "0.25"
"seahash" = "4.1"
"taffy" = "=0.13.0"
"waker-fn" = "1.2.0"
"lyon" = "1.0"
"pin-project" = "1.1.10"
"spin" = "0.10.0"
["dependencies"."accesskit"]
"version" = "0.24.0"
"features" = ["enumn"]

["dependencies"."anyhow"]
"version" = "1.0.86"

["dependencies"."async-task"]
"version" = "4.7"

["dependencies"."backtrace"]
"version" = "0.3"
"optional" = true

["dependencies"."bitflags"]
"version" = "2.6.0"

["dependencies"."collections"]
"version" = "0.1.0"
"git" = "https://github.com/zed-industries/zed"
"rev" = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8"

["dependencies"."criterion"]
"version" = "0.5"
"features" = ["html_reports"]
"optional" = true

["dependencies"."ctor"]
"version" = "1.0.12"

["dependencies"."derive_more"]
"version" = "2.1.1"
