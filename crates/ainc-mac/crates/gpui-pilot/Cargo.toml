[package]
name = "gpui-pilot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = []
host = ["dep:gpui", "dep:accesskit", "dep:image", "dep:async-channel", "dep:futures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
getrandom = "0.3"
libc = "0.2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", default-features = false, features = ["pilot", "test-support"], optional = true }
accesskit = { version = "0.24.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
async-channel = { version = "2", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
