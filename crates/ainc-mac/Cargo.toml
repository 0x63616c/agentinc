[package]
name = "agentinc-os"
version.workspace = true
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
ainc-release = { path = "../ainc-release" }
gpui-pilot = { path = "../gpui-pilot", optional = true, features = ["host"] }
accesskit = "0.24.0"
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", default-features = false, features = ["font-kit"] }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1"
chrono = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
ainc-client = { path = "../ainc-client" }
reqwest = { version = "0.13", features = ["json"] }
progenitor-client = "0.14"
tokio.workspace = true
uuid.workspace = true
pulldown-cmark = "0.13"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSString"] }
libloading = "0.8"
raw-window-handle = "0.6"

[features]
automation = ["dep:gpui-pilot", "gpui/pilot", "gpui/test-support", "gpui_platform/test-support"]
rendered-tests = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
futures.workspace = true
tokio-tungstenite = "0.29"
libc = "0.2"
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", default-features = false, features = ["font-kit", "test-support"] }
tempfile = "3"

[[test]]
name = "rendered_shell"
path = "tests/rendered_shell.rs"
harness = false
required-features = ["rendered-tests"]

[[test]]
name = "pilot_acceptance"
path = "tests/pilot_acceptance.rs"
required-features = ["automation"]

[[test]]
name = "pilot_terminal_sessions"
path = "tests/pilot_terminal_sessions.rs"
required-features = ["automation"]
