[workspace]
resolver = "2"
members = ["crates/agentinc", "crates/agentinc-macros", "crates/agentinc-os"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
agentinc = { path = "crates/agentinc" }
agentinc-macros = { path = "crates/agentinc-macros" }

anyhow = "1"
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

temporalio-sdk = { version = "1.0", features = ["testing"] }
temporalio-client = "1.0"
temporalio-common = "1.0"
temporalio-macros = "1.0"
temporalio-workflow = "1.0"
# Only to turn TLS on for the SDK's dev-server download; not imported anywhere.
temporalio-sdk-core = { version = "0.9", default-features = false, features = ["tls-ring"] }
