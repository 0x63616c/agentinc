[workspace]
resolver = "2"
members = ["crates/agentic", "crates/agentic-macros", "examples/weather"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
agentic = { path = "crates/agentic" }
agentic-macros = { path = "crates/agentic-macros" }

anyhow = "1"
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

temporalio-sdk = { version = "1.0", features = ["testing"] }
temporalio-client = "1.0"
temporalio-common = "1.0"
temporalio-macros = "1.0"
temporalio-workflow = "1.0"
