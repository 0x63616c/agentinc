[workspace]
resolver = "3"
members = ["crates/ainc-release", "crates/turnkeel", "crates/turnkeel-macros", "crates/ainc-mac", "crates/ainc-daemon", "crates/ainc-client", "crates/ainc-cli", "crates/ainc-xtask", "crates/gpui-pilot", "crates/gpui-pilot-cli"]
exclude = ["vendor/gpui"]

[workspace.package]
# Product version for ainc-release, ainc-cli, ainc-client, ainc-daemon and agentinc-os.
# After editing, run `cargo xtask generate` and commit its generated API/client changes.
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
turnkeel = { path = "crates/turnkeel" }
turnkeel-macros = { path = "crates/turnkeel-macros" }

anyhow = "1"
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

temporalio-sdk = { version = "1.0", features = ["testing"] }
temporalio-client = "1.0"
temporalio-common = "1.0"
temporalio-macros = "1.0"
temporalio-workflow = "1.0"
# Only to turn TLS on for the SDK's dev-server download; not imported anywhere.
temporalio-sdk-core = { version = "0.9", default-features = false, features = ["tls-ring"] }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/gpui" }

[profile.dev]
debug = 0

[profile.release]
strip = true
